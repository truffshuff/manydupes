name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Install development tools
        run: gem install standard:1.57.0 erb_lint:0.9.0 minitest:6.1.0 --no-document
      - name: Lint Ruby and ERB
        run: |
          standardrb
          erb_lint --lint-all
      - name: Run unit tests and check JavaScript syntax
        run: |
          ruby test/storage_operations_test.rb
          ruby test/review_store_test.rb
          node --check lib/duplicate_adjudicator/review.js
